# RadarWaveAnalyzer — 运行时配置
# 所有参数均可按不同雷达型号/场景调整

# ---- 采样与分段 ----
SAMPLING_PERIOD_MS: 50          # 标称采样周期（ms），20Hz
GAP_THRESHOLD: 500              # 时间间隔切分阈值（ms），= 10 × SAMPLING_PERIOD_MS
MIN_TRAJ_FRAMES: 20             # 有效轨迹最小帧数
WRAP_HIGH: 250                  # 回绕判定上限（Track_Age >= 此值视为可能回绕）
WRAP_LOW: 5                     # 回绕判定下限（Track_Age <= 此值视为回绕延续）

# ---- 位置不连续 / ID 复用 增强判定 ----
# 规则 F（位置跳变切分）默认关闭：开启后会基于物理量空间位移强制切分同 ID 复用目标，
# 需先用 SPATIAL_ANOMALY 标记观察阈值合理性后再启用，避免误切分。
SPATIAL_SPLIT_ENABLED: false    # 是否启用位置跳变强制切分（规则 F）
MAX_TRACK_SPEED: 50.0           # 帧间最大合理速度（m/s），超过视为不同物理目标
POS_JUMP_THRESHOLD: 5.0         # 同时间戳(Δt=0)位置跳变阈值（m），超过视为不同目标
POSITION_COLUMNS: [Dx, Dy]      # 用于计算空间位移的物理量列
LIFECYCLE_COLUMNS: []           # 生命周期/状态字段（如 Track_Status），留空表示不使用
LIFECYCLE_END_TOKENS: [end, dead, lost, invalid, "0", "false"]
LIFECYCLE_START_TOKENS: [new, begin, valid, alive, "1", "true"]

# ---- 交互筛选 ----
TIMESTAMP_WINDOW_SEC: 30        # 精确定位模式的时间窗口半径（秒）
DEFAULT_QUANTITY: Dx            # 默认展示的物理量曲线
MAX_OVERLAY_CURVES: 4           # 多选叠加模式最大同时显示曲线数

# ---- 大文件读取 ----
CSV_CHUNK_THRESHOLD_MB: 200     # 文件达到此大小时启用分块读取（MB）
CSV_CHUNK_SIZE_ROWS: 100000     # 每个数据块的读取行数

# ---- 雷达数据源 ----
radar_sources: {}

# 多文件同时上传时，按文件名自动区分前/后角雷达。
RADAR_FILE_PATTERNS:
  flr:
    label: "前角雷达"
    short_label: "FLR 前角"
    patterns: ["(?:^|[_-])flr(?:[_-]|$)"]
  rlr:
    label: "后角雷达"
    short_label: "RLR 后角"
    patterns: ["(?:^|[_-])rlr(?:[_-]|$)"]
UNKNOWN_RADAR_SOURCE_LABEL: "未识别雷达"

# ---- 物理量定义 ----
quantities:
  Dx:
    label: "Dx"
    unit: "m"
  Dy:
    label: "Dy"
    unit: "m"
  Vx:
    label: "Vx"
    unit: "m/s"
  Vy:
    label: "Vy"
    unit: "m/s"
  Ax:
    label: "Ax"
    unit: "m/s²"
  Ay:
    label: "Ay"
    unit: "m/s²"
  HeadingAngle:
    label: "HeadingAngle"
    unit: "°"
  Vabs:
    label: "Vabs"
    unit: "m/s"
  Rx_front:
    label: "Rx_front"
    unit: "m"
  Rx_rear:
    label: "Rx_rear"
    unit: "m"
  Ry:
    label: "Ry"
    unit: "m"

# ---- 导出 ----
EXPORT_ENCODING: "utf-8-sig"    # CSV 导出编码（BOM 兼容 Excel）

# ---- 服务端缓存 (flask-caching) ----
CACHE_TYPE: "SimpleCache"       # 内存缓存（单进程部署）
CACHE_DEFAULT_TIMEOUT: 0        # 永不超时（桌面应用无过期需求）
CACHE_THRESHOLD: 5000            # 最大缓存条目数

# ---- 降采样 (plotly-resampler) ----
# 静态显示降采样仅影响传给浏览器的点数；统计和导出始终使用原始全量数据。
# 框选按 selectedData.range 的时间边界回查原始数据，不依赖显示点索引。
DISPLAY_DOWNSAMPLING_ENABLED: true
DISPLAY_MAX_POINTS: 5000       # 单条轨迹≤5000帧完整显示；超过时保留分桶极值降采样
GRAPH_RENDERER: "svg"          # 主曲线渲染器：svg=矢量绘制(降采样后≤1200点，缩放最稳，推荐) / webgl=GPU绘制(多子图会创建多个GL上下文，缩放易闪烁抽搐)
WEBGL_MAX_SUBPLOTS: 4          # webgl 模式允许的最大面板数，超过自动回退 svg（GL上下文按子图独立创建，无共享池）
REMOVE_ISOLATED_SINGLE_FRAMES: true  # 剔除切分产生的孤立单帧碎片段（异常首帧/毛刺帧）
# 动态 resampler 仍保留为可选方案；默认关闭，避免与 Plotly 框选事件冲突。
RESAMPLER_ENABLED: false         # 是否启用降采样
RESAMPLER_MAX_POINTS: 5000      # 超过此点数启用降采样
RESAMPLER_DEFAULT_N_SAMPLES: 2000   # 降采样后默认显示点数

# ---- 真值对比 ----
comparison:
  # 空间匹配阈值 (米) — 距离超过此值判为未匹配
  match_threshold: 5.0
  # 时间门控 (毫秒) — 时间差超过此值判为不重叠
  time_gate_ms: 50
  # 延迟扫描范围 (毫秒)。正值表示将雷达时间戳向后移动，负值表示向前移动。
  delay_scan_range: [-200, 200]
  # 延迟扫描步长 (毫秒)
  delay_scan_step: 10
  # 延迟不敏感阈值 — RMSE变化低于此比例视为延迟不敏感
  delay_insensitive_ratio: 0.05
  # 延迟扫描候选至少满足的有效匹配样本数与覆盖率，避免通过丢弃大量帧取得伪最优
  delay_min_matched_frames: 3
  delay_min_match_rate: 0.5
  # 坐标系一致性阈值 (米)
  coord_bias_threshold: 0.5
  # 分距离区间统计边界 (米)
  distance_bins: [0, 10, 20, 50, 70, 100, 150]
  # 目标ID运动过滤与一对一关联：先剔除静止/短轨迹，再做时空匹配
  id_matching:
    enabled: true
    min_frames: 3                 # 少于此帧数的雷达ID不参与关联
    min_speed_mps: 0.3            # P90速度低于该值且无其他运动证据，视为静止
    min_accel_mps2: 1.0           # P90加速度阈值
    min_displacement_m: 0.5       # 相对起点最大位移阈值
    min_pair_frames: 3            # 一个雷达ID/RTK ID关联最少命中帧数
    min_pair_coverage: 0.5        # 关联命中帧占雷达轨迹帧数的最小比例
    # 数据中断只作为图表断点；持续的低 Track_Age 且位置突变才判定 ID 复用
    track_age_gap_ms: 500.0
    track_age_confirm_frames: 2
    track_age_reset_max: 10
    lifecycle_position_jump_m: 8.0
  # 雷达相邻时间间隔超过“中位采样间隔 × 此值”时，图表显示为中断
  radar_gap_break_factor: 2.5
  # 导出编码
  export_encoding: "utf-8-sig"
  # 默认对比指标 — 雷达物理量 vs RTK真值物理量
  default_quantities:
    - cmp_dx
    - cmp_dy
    - cmp_vx
    - cmp_vy
  # 对比指标定义
  #   chart_type: overlay(双线叠加) | error(误差散点+零线) | scatter(散点+阈值线)
  #   radar_col / rtk_col: 对齐结果 DataFrame 中的列名
  quantities:
    cmp_dx:
      label: "Dx"
      unit: "m"
      short_label: "Dx vs CX"
      radar_col: "radar_Dx"
      rtk_col: "rtk_center_x"
      chart_type: "overlay"
    cmp_dy:
      label: "Dy"
      unit: "m"
      short_label: "Dy vs CY"
      radar_col: "radar_Dy"
      rtk_col: "rtk_center_y"
      chart_type: "overlay"
    cmp_vx:
      label: "Vx"
      unit: "m/s"
      short_label: "Vx vs VX"
      radar_col: "radar_Vx"
      rtk_col: "rtk_Vx"
      chart_type: "overlay"
    cmp_vy:
      label: "Vy"
      unit: "m/s"
      short_label: "Vy vs VY"
      radar_col: "radar_Vy"
      rtk_col: "rtk_Vy"
      chart_type: "overlay"
    cmp_pos_error:
      label: "位置误差 ΔDist"
      unit: "m"
      short_label: "ΔDist"
      field: "pos_error_abs"
      chart_type: "error"
    cmp_match_dist:
      label: "匹配距离"
      unit: "m"
      short_label: "MatchDist"
      field: "match_dist"
      chart_type: "scatter"
      threshold: 5.0

# ---- 目标性能指标评估 ----
# 按 RTK 真实纵向距离 d = abs(rtk_center_x) 分六个距离段，计算逐帧误差并给出验收结论。
# 分桶严禁使用雷达 Dx，否则边界附近样本会因测量误差被分配到错误区间。
performance_metrics:
  enabled: true
  # 距离分段边界（米），7 个边界 → 6 个区间 [0,10) [10,20) [20,50) [50,70) [70,100) [100,150]
  distance_bins: [0, 10, 20, 50, 70, 100, 150]
  # 最后一段包含上界（100-150]）
  include_last_upper: true
  # 有效样本纵向距离范围（米）
  valid_distance_range: [0, 150]
  # 准确率判定：准确率 > 该值才通过（严格大于，等于时不通过）
  accuracy_requirement: 0.9545
  # 连续三帧指标判定：R3 < 该值才通过（严格小于，等于时不通过）
  three_frame_requirement: 1.0
  # 区间最少有效样本数，低于此值不出具通过/不通过结论
  min_samples_for_conclusion: 3
  # 数据中断判定：相邻帧间隔 > 正常间隔分位数 × 该系数 视为中断（复用对比图 radar_gap_break_factor 口径）
  gap_break_factor: 2.5
  # 正常间隔分位数：用较低分位数避免长中断本身抬高间隔中位数
  gap_percentile: 25

  # 阈值模式说明：
  #   absolute                    固定绝对值：T = absolute
  #   percent                     真值百分比：T = percent × abs(truth)
  #   max_absolute_percent        取大：T = max(absolute, percent × abs(truth))
  #   scaled_max_absolute_percent 系数 × 取大：T = scale × max(absolute, percent × abs(truth))
  metrics:
    Dx:
      label: "Dx"
      unit: "m"
      mode: "binned"
      radar_col: "radar_Dx"
      truth_col: "rtk_center_x"
      # 百分比基准：distance=纵向距离 d=abs(rtk_center_x)；truth=本物理量真值绝对值
      percent_basis: "distance"
      bins:
        - range: [0, 10]
          normal_limit: {mode: max_absolute_percent, absolute: 0.3, percent: 0.01}
          three_frame_limit: {mode: absolute, absolute: 0.5}
        - range: [10, 20]
          normal_limit: {mode: max_absolute_percent, absolute: 0.3, percent: 0.01}
          three_frame_limit: {mode: absolute, absolute: 0.5}
        - range: [20, 50]
          normal_limit: {mode: percent, percent: 0.02}
          three_frame_limit: {mode: absolute, absolute: 1.5}
        - range: [50, 70]
          normal_limit: {mode: percent, percent: 0.02}
          three_frame_limit: {mode: percent, percent: 0.05}
        - range: [70, 100]
          normal_limit: {mode: percent, percent: 0.02}
          three_frame_limit: {mode: percent, percent: 0.07}
        - range: [100, 150]
          normal_limit: {mode: percent, percent: 0.025}
          three_frame_limit: {mode: percent, percent: 0.10}

    Dy:
      label: "Dy"
      unit: "m"
      mode: "binned"
      radar_col: "radar_Dy"
      truth_col: "rtk_center_y"
      percent_basis: "distance"
      bins:
        - range: [0, 10]
          normal_limit: {mode: absolute, absolute: 0.2}
          three_frame_limit: {mode: absolute, absolute: 0.3}
        - range: [10, 20]
          normal_limit: {mode: absolute, absolute: 0.3}
          three_frame_limit: {mode: absolute, absolute: 0.6}
        - range: [20, 50]
          normal_limit: {mode: absolute, absolute: 0.3}
          three_frame_limit: {mode: absolute, absolute: 0.6}
        - range: [50, 70]
          normal_limit: {mode: absolute, absolute: 0.6}
          three_frame_limit: {mode: absolute, absolute: 1.2}
        - range: [70, 100]
          normal_limit: {mode: absolute, absolute: 0.6}
          three_frame_limit: {mode: absolute, absolute: 1.2}
        - range: [100, 150]
          normal_limit: {mode: absolute, absolute: 1.0}
          three_frame_limit: {mode: absolute, absolute: 2.1}

    Vx:
      label: "Vx"
      unit: "m/s"
      mode: "binned"
      radar_col: "radar_Vx"
      truth_col: "rtk_Vx"
      # v = abs(Vx_truth)
      percent_basis: "truth"
      bins:
        - range: [0, 10]
          normal_limit: {mode: max_absolute_percent, absolute: 0.3, percent: 0.03}
          three_frame_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.05}
        - range: [10, 20]
          normal_limit: {mode: max_absolute_percent, absolute: 0.3, percent: 0.03}
          three_frame_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.05}
        - range: [20, 50]
          normal_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.03}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.4, absolute: 1.5, percent: 0.05}
        - range: [50, 70]
          normal_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.04}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.4, absolute: 1.5, percent: 0.05}
        - range: [70, 100]
          normal_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.05}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.5, absolute: 1.5, percent: 0.07}
        - range: [100, 150]
          normal_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.07}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.5, absolute: 1.5, percent: 0.10}

    Vy:
      label: "Vy"
      unit: "m/s"
      mode: "binned"
      radar_col: "radar_Vy"
      truth_col: "rtk_Vy"
      percent_basis: "truth"
      bins:
        - range: [0, 10]
          normal_limit: {mode: absolute, absolute: 0.3}
          three_frame_limit: {mode: absolute, absolute: 0.52}
        - range: [10, 20]
          normal_limit: {mode: absolute, absolute: 0.3}
          three_frame_limit: {mode: absolute, absolute: 0.52}
        - range: [20, 50]
          normal_limit: {mode: absolute, absolute: 0.3}
          three_frame_limit: {mode: absolute, absolute: 0.52}
        - range: [50, 70]
          normal_limit: {mode: absolute, absolute: 0.5}
          three_frame_limit: {mode: absolute, absolute: 1.04}
        - range: [70, 100]
          normal_limit: {mode: absolute, absolute: 0.5}
          three_frame_limit: {mode: absolute, absolute: 1.04}
        - range: [100, 150]
          normal_limit: {mode: absolute, absolute: 0.8}
          three_frame_limit: {mode: absolute, absolute: 1.3}

    Ax:
      label: "Ax"
      unit: "m/s²"
      mode: "binned"
      # 加速度真值经用户映射生成（列名形如 rtk[Ax]），故使用候选列回退
      radar_col: "radar[Ax]"
      truth_col: "rtk[Ax]"
      radar_col_fallbacks: ["radar[ax]", "radar_Ax", "radar_AX"]
      truth_col_fallbacks: ["rtk[ax]", "rtk_Ax", "rtk_AX"]
      # a = abs(Ax_truth)
      percent_basis: "truth"
      bins:
        - range: [0, 10]
          normal_limit: {mode: max_absolute_percent, absolute: 0.3, percent: 0.05}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.4, absolute: 0.5, percent: 0.08}
        - range: [10, 20]
          normal_limit: {mode: max_absolute_percent, absolute: 0.3, percent: 0.05}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.4, absolute: 0.5, percent: 0.08}
        - range: [20, 50]
          normal_limit: {mode: max_absolute_percent, absolute: 0.5, percent: 0.08}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.5, absolute: 1.0, percent: 0.12}
        - range: [50, 70]
          normal_limit: {mode: max_absolute_percent, absolute: 0.5, percent: 0.08}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.5, absolute: 1.0, percent: 0.12}
        - range: [70, 100]
          normal_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.12}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.6, absolute: 1.5, percent: 0.15}
        - range: [100, 150]
          normal_limit: {mode: max_absolute_percent, absolute: 1.0, percent: 0.12}
          three_frame_limit: {mode: scaled_max_absolute_percent, scale: 1.6, absolute: 1.5, percent: 0.15}

    Ay:
      label: "Ay"
      unit: "m/s²"
      # 单项限值：完整曲线内所有有效样本绝对误差 <= 1m/s² 才通过，不分段、不算准确率与 R3
      mode: "single_limit"
      abs_limit: 1.0
      operator: "<="
      radar_col: "radar[Ay]"
      truth_col: "rtk[Ay]"
      radar_col_fallbacks: ["radar[ay]", "radar_Ay", "radar_AY"]
      truth_col_fallbacks: ["rtk[ay]", "rtk_Ay", "rtk_AY"]
