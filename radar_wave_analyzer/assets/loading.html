<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启动中...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
}
.spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(59, 130, 246, 0.2);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.title { color: #e2e8f0; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.sub { color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>
<div class="spinner"></div>
<div class="title">雷达目标轨迹波动分析系统</div>
<div class="sub">正在初始化，请稍候...</div>
</body>
</html>
